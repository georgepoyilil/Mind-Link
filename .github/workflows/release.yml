name: Build & Release MindLink APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Distribution APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MindLink-v1.0.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindLink-v1.0.0-APK
          path: dist/MindLink-v1.0.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/MindLink-v1.0.0.apk
          name: "MindLink ${{ github.ref_name }} (Preloaded with 36 Notes & On-Device AI)"
          generate_release_notes: true
          draft: false
          prerelease: false
